name: Auto commit

on: 
  push:
    branches: 
      - master
      - main  # Add main branch as well
      
  schedule:
    - cron: "17 * * * *"  # Runs at minute 17 of every hour
  
  workflow_dispatch:  # Allows manual triggering for testing

permissions:
  contents: write  # Explicit write permission

concurrency:
  group: auto-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto_commit: 
    runs-on: ubuntu-latest
    steps:
      - name: DEBUG 
        run:  echo "::debug::Ref = ${{github.ref}}"
        
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED
          
      - name: Commit changes
        run: |
          git config --local user.email "eguinjonathan08@gmail.com"
          git config --local user.name "Jonathan0823"
          git add -A
          
          arr[0]="chore(bot): 😂 auto commit"
          arr[1]="chore(bot): 😱 auto commit"
          arr[2]="chore(bot): 👿 auto commit"
          arr[3]="chore(bot): 💩 auto commit"
          arr[4]="chore(bot): 🙏 auto commit"
          arr[5]="chore(bot): 🙈 auto commit"
          arr[6]="chore(bot): 🐐 auto commit"
          arr[7]="chore(bot): 🤖 auto commit"
          arr[8]="chore(bot): 🟩 auto commit"
          arr[9]="chore(bot): 👻 auto commit"
          
          rand=$[$RANDOM % ${#arr[@]}]
          
          git diff --staged --quiet || git commit -m "${arr[$rand]}"
          
      - name: GitHub Push
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
